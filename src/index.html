<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"
    />
    <title>24H</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <div class="brand">24H<small>desktop</small></div>
      <span class="chip" id="core-chip">核心 <code id="core-state">启动中…</code></span>
      <span class="chip" id="gw-chip" hidden>通道 <code id="gw-state">未连接</code></span>
      <div class="spacer"></div>
      <select class="chip" id="model-select" title="模型">
        <option value="">模型：读取中…</option>
      </select>
      <button class="icon" id="btn-files" title="文件面板">文件</button>
      <button class="icon" id="btn-logs" title="核心日志">日志</button>
      <button class="icon" id="btn-settings" title="设置">设置</button>
    </header>

    <main>
      <aside>
        <div class="side-head">
          <button class="primary" id="btn-new">新建会话</button>
          <button id="btn-refresh" title="刷新会话列表">刷新</button>
        </div>
        <div class="side-search">
          <input id="search" placeholder="搜索会话…" />
        </div>
        <div class="sessions" id="sessions"></div>
      </aside>

      <aside class="files" id="files-panel" hidden>
        <div class="side-head">
          <span id="files-path" class="path">—</span>
          <button id="btn-files-up" title="上一级">↑</button>
          <button id="btn-files-refresh" title="刷新">⟳</button>
        </div>
        <div class="entries" id="entries"></div>
        <div class="preview" id="preview" hidden></div>
      </aside>

      <section class="chat">
        <div class="banner" id="banner" hidden></div>
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="box">
            <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
            <div class="row">
              <button class="primary" id="btn-send">发送</button>
              <button id="btn-stop" hidden>停止</button>
              <span id="turn-state"></span>
              <span class="spacer"></span>
              <button id="btn-cwd" title="选择工作目录"><span id="cwd-label">工作目录</span></button>
      <span id="session-label"></span>
            </div>
          </div>
        </div>
        <div class="drawer" id="drawer" hidden></div>
      </section>
    </main>

    <div class="modal" id="settings" hidden>
      <div class="card">
        <h2>设置</h2>
        <div class="field">
          <label>服务商</label>
          <select id="set-provider"></select>
          <div class="hint" id="provider-hint">从核心读取的可用服务商；带「当前」标记的是正在使用的。</div>
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="set-key" type="password" placeholder="粘贴该服务商的 API Key（保存进核心配置）" />
          <div class="hint">保存后写进核心配置，壳不落盘、不回显。</div>
        </div>
        <div class="field">
          <label>默认模型</label>
          <input id="set-model" placeholder="例如 z-ai/glm-5.2、deepseek-chat…" />
          <div class="hint">留空则用服务商默认模型。</div>
        </div>
        <div class="field">
          <label>自定义 OpenAI 兼容端点（国产服务商 / 自建网关）</label>
          <div class="stack">
          <input id="ce-name" placeholder="名称，如 火山方舟" />
          <input id="ce-base" placeholder="Base URL，如 https://ark.cn-beijing.volces.com/api/v3" />
          <input id="ce-model" placeholder="模型名，如 doubao-pro-32k" />
          <input id="ce-key" type="password" placeholder="API Key" />
          <button id="btn-ce-save">保存并设为默认</button>
          </div>
          <div class="hint" id="ce-status"></div>
          <div id="custom-endpoints" class="mt8"></div>
        </div>
        <div class="field">
          <label>运行信息</label>
          <div id="run-info"></div>
        </div>
        <div class="actions">
          <button class="primary" id="btn-save-settings">保存</button>
          <button id="btn-close-settings">关闭</button>
          <span class="spacer"></span>
          <button id="btn-restart-core" title="重启核心进程">重启核心</button>
        </div>
        <div class="hint" id="settings-status"></div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
