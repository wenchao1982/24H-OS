# Bot Mode 花名册样例
# 复制到 ~/.24os/bots.yaml，或设置 OS_BOTS_FILE 指向本文件。
# 调度器默认关闭：设置 OS_BOT_ENABLED=1 后重启 server 才会启动。
#
# 格式：
#   id       — ^[a-z0-9][a-z0-9_-]{0,63}$
#   schedule — 每天 HH:MM（服务器本地时区），^\d{2}:\d{2}$
#   profile  — Hermes profile（缺省 default）
#   prompt   — 非空
#   notify   — 已安装 app 的 plugins[].name 列表
#   enabled  — 默认 true；也可用 disable: true 关闭单条

bots:
  - id: daily-report
    schedule: "09:00"
    profile: default
    prompt: "生成今日运营简报：汇总昨日告警、任务完成率与待办风险点，用 Markdown 列表输出。"
    notify: [ops-push]
    enabled: true

  - id: weekly-review
    schedule: "18:00"
    profile: default
    prompt: "生成本周回顾草稿（3 条亮点 + 2 条风险）。"
    notify: []
    disable: true
