name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新运行取消旧的，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只读仓库内容。
permissions:
  contents: read

jobs:
  # 快速 job：类型检查 + 全部单测（server node + web jsdom）+ 构建。
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # check 不需要 electron 运行时二进制，跳过下载以加速（若依赖顺序导致失败可移除）。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + tests
        run: npm run check

      - name: Build (web + server)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node }}
          path: |
            dist/web
            dist/server.cjs
          if-no-files-found: error

  # 真实浏览器 e2e（独立于 check 矩阵，避免拖慢单测）：隔离 HOME/HERMES_HOME +
  # 假 CLI + 浏览器层 mock SSE，绝不调真实模型、不触碰真实 ~/.hermes。
  # 仅用 chromium（不加 --with-deps 之外的浏览器），失败上传截图/trace。
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e (build:web + headless chromium)
        run: npm run test:e2e

      - name: Upload e2e artifacts (screenshots / traces / report)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/.artifacts
            playwright-report
          if-no-files-found: ignore

  # 重 job：electron-builder 打包 Linux 安装包，仅在手动触发或 v* tag 时运行。
  dist:
    name: dist (linux)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 不跳过 electron 下载：electron-builder 需要二进制。
      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
