# CI：把"能机械验证的部分"固化下来（两个 job 都不需要图形环境与核心运行时）
#   static —— 静态护栏 + 与核心契约的比对（node scripts/smoke.mjs --static）
#   ui     —— 下 chrome-headless-shell 跑真浏览器渲染检查（node scripts/ui-smoke.mjs）
#
# ⚠️ 用 API + fine-grained PAT 推送本文件时，该 PAT 需要 **Workflows: Read and write** 权限
#    （GitHub 对 .github/workflows/* 单独要权限，否则整次推送会 403；
#      scripts/push-24h-os.py 已做兜底：遇到 403 会自动跳过该目录并给出警告）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态护栏（含契约比对）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖（跳过 electron 的 postinstall：这里不需要二进制）
        run: npm ci --ignore-scripts
      - name: 静态护栏
        run: node scripts/smoke.mjs --static

  ui:
    name: 界面层（无头浏览器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: |
          npm ci --ignore-scripts
          npm i --no-save puppeteer-core --registry=https://registry.npmmirror.com --no-audit --no-fund
      - name: 下载 chrome-headless-shell（国内镜像，不需要图形环境）
        run: |
          curl -sL -o /tmp/hs.zip https://cdn.npmmirror.com/binaries/chrome-for-testing/141.0.7390.65/linux64/chrome-headless-shell-linux64.zip
          unzip -q /tmp/hs.zip -d /tmp/chrome
      - name: 界面层冒烟
        run: CHROME=/tmp/chrome/chrome-headless-shell-linux64/chrome-headless-shell node scripts/ui-smoke.mjs
